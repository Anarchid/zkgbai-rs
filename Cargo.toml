[workspace]
resolver = "3"
members = ["crates/springai-sys", "crates/springai", "crates/terrain", "crates/zkgbai", "tools/terrain-view"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/Anarchid/zkgbai-rs"
rust-version = "1.88"

[workspace.dependencies]
springai-sys = { path = "crates/springai-sys" }
springai = { path = "crates/springai" }
zk-terrain = { path = "crates/terrain" }
# Terrain decomposition into regions and chokepoints.
zkta = { package = "zkta-rs", git = "https://github.com/Anarchid/zkta-rust", rev = "828d873", default-features = false }

[profile.release]
# The engine must never be taken down by an AI panic: we catch unwinds at the
# FFI boundary, so `panic = "abort"` is not an option.
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
# Keep symbol names for the engine crash handler's backtraces; panic
# locations are embedded regardless of debug info.
strip = "debuginfo"

[profile.dev]
# Pathfinding and threat painting are hot loops; unoptimised builds are too
# slow to play a real game with.
opt-level = 1

[patch.crates-io]
# zkta's Voronoi backend (boostvoronoi) keeps its beach line in a cpp_map skip
# list with OS-seeded levels, which made terrain analysis vary between runs;
# zkta-rust vendors cpp_map with a fixed-seed RNG. Dependents must repeat this.
cpp_map = { git = "https://github.com/Anarchid/zkta-rust", rev = "828d873" }
