[package]
name = "zkgbai"
version = "0.6.0"
description = "Zero-K Graph-Based AI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The engine expects `libSkirmishAI.so` / `SkirmishAI.dll`; packaging renames
# the artifact (see tools/package.sh).
name = "zkgbai"
crate-type = ["cdylib", "rlib"]

[dependencies]
checkpoint = { path = "../checkpoint" }
springai.workspace = true
zk-terrain.workspace = true
serde_json = "1"
# The banter lexicon (data/banter.toml and players' banter.toml).
toml = "1"
delaunator = "1"
# The board: the map as a PNG for pilots that read images.
png = "0.18"
